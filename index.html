<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | Ashley</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>

.home-photo {
    width: 150px !important;
    height: 150px !important;
    max-width: 150px !important;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: 20px auto;
}

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFF8F0;
            color: #625D4E;
            font-family: 'Lora', serif;
        }

        /* TOP BAR */

        .topbar {
    background-color: #F8E5E1;
    padding: 18px 10px;
    text-align: center;
    color: #9D7374;
}

.topbar p {
    margin: 0;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 16px;
}

        /* MAIN SECTION */

        .hero {
            min-height: 570px;
            padding: 65px 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        /* SIDE CARDS */

        .side-card {
            width: 230px;
            min-height: 260px;
            padding: 25px 18px;
            background-color: #F4EBDD;
            border: 1px solid #E8DCCB;
            transform: rotate(-4deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .side-card p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 21px;
            line-height: 1.5;
            color: #746B55;
        }

        .side-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .right-card {
            transform: rotate(4deg);
            background-color: #F8E5E1;
        }

        /* CENTER TEXT */

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .hero-content h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(65px, 9vw, 105px);
            font-weight: normal;
            line-height: 1.1;
            color: #B77F83;
            margin: 0;
        }

        .divider {
            width: 180px;
            height: 2px;
            background-color: #A9AE88;
            margin: 25px auto;
        }

        .hero-content h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 25px;
            font-weight: 600;
            color: #746B55;
            margin: 0;
        }

        .hero-content p {
            font-family: 'Lora', serif;
            font-size: 14px;
            line-height: 1.8;
            color: #81766A;
            margin-top: 15px;
        }

        /* NAVIGATION */

        .navigation {
            background-color: #A9AE88;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 18px 10px;
            border-bottom: 6px dotted #F8E5E1;
        }

        .navigation a {
            text-decoration: none;
            color: #FFF8F0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 25px;
            font-weight: 600;
            padding: 5px 35px;
            transition: 0.3s;
        }

        .navigation a:hover {
            color: #B77F83;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            color: #A17D75;
        }

        /* MOBILE DESIGN */

        @media (max-width: 750px) {

            .hero {
                flex-direction: column;
                padding: 45px 20px;
                gap: 35px;
            }

            .side-card {
                display: none;
            }

            .hero-content {
                width: 100%;
            }

            .hero-content h1 {
                font-size: 72px;
            }

            .navigation a {
                font-size: 21px;
                padding: 10px 18px;
            }

        }

    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">
        <p>Ashley's Personal Website</p>
    </div>


    <!-- HERO SECTION -->

    <section class="hero">

        <!-- LEFT DECORATIVE CARD -->

        <div class="side-card">
            <p>
                collecting<br>
                little moments<br>
                and memories<br>
                along the way.
            </p>
        </div>


        <!-- CENTER CONTENT -->

        <div class="hero-content">

            <h1>Ashley's Little World</h1>

            <div class="divider"></div>
          <img src="images/home-profile.jpg"
            alt="My Profile"
            class="home-photo">
          

            <h2>Welcome to my personal space!</h2>

            <p>
                A little place where you can discover
                my interests, experiences, and the things
                that make me who I am.
            </p>

        </div>


        <!-- RIGHT PROFILE CARD -->

        <div class="side-card right-card">

            <p> A little glimpse of me. </p>

        </div>

    </section>


    <!-- NAVIGATION BAR -->

    <nav class="navigation">

        <a href="index.html">home</a>

        <a href="about.html">about</a>

        <a href="contact.html">contact</a>

    </nav>

</body>
</html>
.
